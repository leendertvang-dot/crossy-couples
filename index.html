<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7CC623">
<title>Crossy Couples — 2 spelers op 1 telefoon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;height:-webkit-fill-available;overflow:hidden;
    background:#0d1408;position:fixed;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:none;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  canvas{image-rendering:pixelated;image-rendering:-webkit-optimize-contrast;
    image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  .ui{position:absolute;inset:0;pointer-events:none}
  .pix{font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff;
    text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000,
                2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}

  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:calc(8px + env(safe-area-inset-top)) 12px 0;gap:8px}
  .tag{display:flex;flex-direction:column;gap:1px;font-size:11px;max-width:38%}
  .tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag b{font-size:24px;line-height:1}
  .wins{text-align:center;font-size:10px}
  .wins b{display:block;font-size:19px;letter-spacing:.12em}

  #mid{position:absolute;top:0;bottom:0;left:50%;width:0;border-left:2px dashed rgba(0,0,0,.18)}

  #count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:min(34vw,150px);line-height:1;opacity:0}
  #count.on{opacity:1}

  #banner{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;
    font-size:min(8.5vw,38px);line-height:1.1;padding:0 16px}
  #town{position:absolute;left:0;right:0;top:15%;text-align:center;opacity:0;pointer-events:none}
  #town span{display:inline-block;background:#164C92;color:#fff;border:3px solid #fff;
    border-radius:5px;padding:5px 16px 6px;font-size:min(6.2vw,26px);font-weight:900;
    letter-spacing:.10em;text-transform:uppercase;box-shadow:0 4px 0 rgba(0,0,0,.45)}
  .buff{font-size:10px;letter-spacing:.08em;min-height:12px}

  .scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:13px;background:rgba(8,16,6,.72);pointer-events:auto;
    padding:18px 14px calc(18px + env(safe-area-inset-bottom));text-align:center}
  .scr.hide{display:none}
  #title{font-size:min(11.5vw,54px);line-height:.92;background:#000;color:#fff;
    padding:10px 18px 13px;transform:rotate(-3deg);border:4px solid #000;
    box-shadow:7px 7px 0 rgba(0,0,0,.5)}
  #sub,#endSub{font-size:14px;max-width:23em;line-height:1.55;color:#fff;font-weight:700;
    text-shadow:1px 1px 0 #000}
  .btn{pointer-events:auto;background:#F5D33C;color:#3A2A00;border:4px solid #000;
    padding:12px 26px;font-size:19px;font-weight:900;text-transform:uppercase;
    letter-spacing:.07em;box-shadow:0 6px 0 #000;cursor:pointer}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
  .btn.alt{background:#E9E9EE}
  .btn.small{padding:10px 16px;font-size:14px}
  .btn[disabled]{opacity:.35}
  .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .zones{display:flex;gap:10px;width:100%;max-width:340px}
  .zone{flex:1;border:3px dashed rgba(255,255,255,.55);border-radius:8px;padding:7px 4px;
    font-size:11px;font-weight:800;color:#fff;text-shadow:1px 1px 0 #000;line-height:1.45}

  #pickHead{font-size:17px}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:330px;
    max-height:56vh;overflow-y:auto;padding:2px;touch-action:pan-y}
  .card{pointer-events:auto;background:rgba(255,255,255,.10);border:3px solid rgba(255,255,255,.18);
    border-radius:9px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;
    gap:2px;position:relative;cursor:pointer}
  .card canvas{width:100%;height:auto;max-width:62px;display:block}
  .card .nm{font-size:10.5px;font-weight:900;color:#fff;text-shadow:1px 1px 0 #000;
    letter-spacing:.02em;line-height:1.1}
  .card.p1{border-color:#2E8BE0;background:rgba(46,139,224,.22)}
  .card.p2{border-color:#D82E8B;background:rgba(216,46,139,.22)}
  .card .badge{position:absolute;top:-8px;right:-6px;font-size:9px;font-weight:900;color:#fff;
    padding:2px 5px;border-radius:20px;border:2px solid #000;letter-spacing:.04em}
  .card.p1 .badge{background:#2E8BE0}
  .card.p2 .badge{background:#D82E8B}

  #iosnote{font-size:11.5px;line-height:1.45;color:#FFE08A;font-weight:700;max-width:24em;
    text-shadow:1px 1px 0 #000}
  #iosnote:empty{display:none}
  #credit{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));
    font-size:13px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;
    color:rgba(255,255,255,.56);text-shadow:0 1px 0 rgba(0,0,0,.6);pointer-events:none}
  #credit sup{font-size:8px;vertical-align:super;letter-spacing:0}

  #btns{position:absolute;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px}
  #btns button{pointer-events:auto;background:rgba(0,0,0,.42);color:#fff;border:0;
    width:34px;height:34px;font-size:15px;border-radius:7px;line-height:34px;padding:0}
</style>
</head>

<script>
"use strict";
/* ==========================================================================
   CROSSY DUEL — lokale 2-speler hopper in Crossy-Road-stijl
   Eén wereld, één camera, laatste die leeft wint de ronde.
   Alles wat je wilt tweaken staat in CFG en CHARS hieronder.
   ========================================================================== */

const CFG = {
  baseWidth   : 320,   tilesAcross : 9.6,
  yaw         : 15,    pitch       : 0.80,  zScale : 0.82,  anchor : 0.70,
  colMin      : -4,    colMax      : 4,
  track       : 26,    trainLen    : 8,
  hopTime     : 0.135, killRows    : 4.6,   camFollow : 6,  drownEdge : 6.6,
  safeRows    : 3,     railFrom    : 12,    rampRows  : 170,
  maxParticles: 48,

  stackZ      : 1.05,  /* hoogte waarop je op de schouders van de ander staat */
  animalFrom  : 6,     animalChance: 0.22,  animalSpeed : 0.55,
  rideTime    : 7.0,   /* schaap én bokje: je zit erop en rijdt door het verkeer */
  miles       : [10, 20, 30, 40],  /* verloving, bruiloft, baby's, rollators */
  storkTime   : 1.75,  /* hoe lang de ooievaar-animatie duurt */
  finish      : 100,   /* eindpunt: kermisterrein, samen gewonnen */
  partyTime   : 3.0,   /* hoe lang het feest duurt voor het eindscherm komt */
  bikeChance  : 0.07,  /* kans op een fietspad */
  boatChance  : 0.30   /* kans dat er een zeilboot in een waterrij ligt */
};

/* ---------- personages ----------------------------------------------------
   Elk poppetje is losjes gebaseerd op de foto's in de projectmap: haarkleur en
   -lengte, bril/pet en de kleur van de kleding op die foto.

   style : short | messy | bob | long | curly | ponytail | bun
   acc   : glasses | shades | cap | headband | beanie | beard | (leeg)
   band  : horizontale baan om de romp {c, z = deel van romphoogte, h}
   tie   : verticale stropdas op de borst  |  bow : strikje bij de kraag
   print : kleine motiefjes op het shirt
   f     : true bij de dames — bepaalt de trouwkleding bij mijlpaal 1
   -------------------------------------------------------------------------- */
const CHARS = [
  /* lang dark-blond haar, zonnebril op het hoofd, hartjesjurk, grote rode zoenlippen */
  {n:'Colinde',   f:1, skin:'#F2C9A2', hair:'#9C7A4C', style:'long',  shirt:'#CFE1F2', pants:'#5C7FA8', hearts:'#E2426B', lips:'#E01F4A'},
  /* bruin haar opgestoken, lila jurk */
  {n:'Gabrielle', f:1, skin:'#EFC49C', hair:'#6B4A2F', style:'bun',   shirt:'#C9BADF', pants:'#B0A2C6'},
  /* donker golvend haar, diepgroene jurk, stevige bruine wenkbrauwen */
  {n:'Norah',     f:1, skin:'#EDBF95', hair:'#3A2418', style:'curly', shirt:'#2E6B5E', pants:'#285C51', brow:'#4A2E18'},
  /* lang blond haar, roze-wit gestreept shirt, spijkerbroek */
  {n:'Bernice',   f:1, skin:'#F3CDA6', hair:'#DCBD6C', style:'long',  shirt:'#F2879B', pants:'#6B8CB5', band:{c:'#F6F6F6', z:0.50, h:0.11}},
  /* volle blond-bruine krullenbos, bloemetjesjurk met ceintuur */
  {n:'Jannita',   f:1, skin:'#EFC49C', hair:'#A8853F', style:'bigcurl', shirt:'#F2F0E8', pants:'#DEDBD2',
   band:{c:'#2E2E33', z:0.10, h:0.09}, flowers:['#E2568C','#F2C230','#7EC4E8','#E2426B','#8FD64A']},
  /* donker haar naar achteren, zachtroze jurk */
  {n:'Gerjanne',  f:1, skin:'#F2C9A2', hair:'#3E2A1C', style:'bun',   shirt:'#F6D8DC', pants:'#E9C5C9'},
  /* blond, donkerblauw pak met lichtblauwe das — kop boven de rest uit */
  {n:'Roelof',    skin:'#EDC099', hair:'#C7A15C', style:'short', shirt:'#2F3651', pants:'#262C42', tie:'#8FB8DE', tall:1.22},
  /* donkerbruin haar, groen shirt met wit bladmotief */
  {n:'Leendert',  skin:'#EFC49C', hair:'#4A3626', style:'short', shirt:'#2E8B57', pants:'#E4E4E4', print:'#EAF6EC'},
  /* lichtblond, bril, beige pak met crème strik */
  {n:'Bert-Jan',  skin:'#F0C7A0', hair:'#C8A05A', style:'short', shirt:'#CDB596', pants:'#B89F7F', acc:'glasses', accC:'#33333B', bow:'#F0EAD8'},
  /* beige pet met ruitertje erop, donkerblauwe polo, spijkerbroek */
  {n:'Thijmen',   skin:'#EDC29C', hair:'#6B4A30', style:'short', shirt:'#2E3A4F', pants:'#5C7FA8', acc:'cap', accC:'#D8CBB0', capLogo:'#1E3A6E'},
  /* bruin haar, lichtgrijs pak met donkerrode das */
  {n:'Wybren',    skin:'#F0C7A0', hair:'#6B4A30', style:'short', shirt:'#DAD4C7', pants:'#C7C0B1', tie:'#8C2F3A'}
];

/* ---------- canvas & schaal ---------------------------------------------- */
const cvMain = document.getElementById('cv');
const ctxMain= cvMain.getContext('2d', {alpha:false});   /* Safari houdt niet van desynchronized */
let ctx = ctxMain;                       // wisselt tijdelijk naar preview-canvassen
const wrap = document.getElementById('wrap');

const YAW = CFG.yaw*Math.PI/180, SIN = Math.sin(YAW), COS = Math.cos(YAW);
const PITCH = CFG.pitch, ZS = CFG.zScale;

let W=CFG.baseWidth, H=560, TILE=33, CX=160, CY=380, ROWH=25, ROWS_UP=20, ROWS_DN=8;

function resize(){
  const w = wrap.clientWidth || 360, h = wrap.clientHeight || 640;
  W = CFG.baseWidth;
  H = Math.max(320, Math.min(1000, Math.round(W * h / w)));
  cvMain.width = W; cvMain.height = H;
  ctxMain.imageSmoothingEnabled = false;
  TILE = W / CFG.tilesAcross;
  CX = W/2; CY = Math.round(H*CFG.anchor);
  ROWH = TILE*PITCH*COS;
  ROWS_UP = Math.ceil(CY/ROWH) + 2;
  ROWS_DN = Math.ceil((H-CY)/ROWH) + 2;
}
addEventListener('resize', resize, {passive:true});
addEventListener('orientationchange', ()=>setTimeout(resize,150), {passive:true});

/* ---------- kleuren ------------------------------------------------------ */
const shCache = new Map();
function sh(hex,f){
  const k=hex+f; let v=shCache.get(k); if(v) return v;
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.round(((n>>16)&255)*f));
  const g=Math.min(255,Math.round(((n>>8)&255)*f));
  const b=Math.min(255,Math.round((n&255)*f));
  v='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
  shCache.set(k,v); return v;
}
const C = {
  grass:['#8FD82C','#7DC623'], grassF:['#63A519','#589415'],
  road :['#4C4C55','#454550'], line:'#E9E9EE',
  water:'#5FC9EF', waterD:'#46B2DA', waterL:'#7BD6F5',
  bike :'#B4553F',
  bed  :'#6E6E7C', tie:'#7A5233', rail:'#C6C6D4',
  logT :'#96633B', logF:'#7A5030', logS:'#653F25',
  trunk:['#8B5A32','#70472A','#5C3A22'],
  leaf :['#B7CE35','#95A929','#7C8E21'],
  leaf2:['#9DC22F','#7F9E25','#69851E'],
  bush :['#C4C0D8','#A29EB6','#8B879E'],
  bushT:['#D2CFE4','#B0ADC2','#9995AC'],
  rock :['#A8AEB6','#8B9199','#767C84'],
  car  :['#F2F2F2','#37AEDE','#7FB93E','#E2564A','#F0C33C','#B77BE0','#FF8A3D'],
  train:['#C4413C','#9E322E','#832925'],
  white:['#F4F4F4','#DADADE','#C0C0C6']
};
const palCache = new Map();
function pal(hex){
  let p=palCache.get(hex);
  if(!p){ p=[hex, sh(hex,0.84), sh(hex,0.70)]; palCache.set(hex,p); }
  return p;
}

/* ---------- projectie ----------------------------------------------------- */
let camY=0, camSX=0, camSY=0, shake=0, oCX=0, oCY=0;
function PX(x,y){ return oCX + (x*COS + y*SIN - camSX)*TILE; }
function PY(x,y,z){ return oCY - (-x*SIN + y*COS - camSY)*TILE*PITCH - z*TILE*ZS; }

let vx0=-6, vx1=6;
function viewRange(y){
  const k = camSX - y*SIN;
  vx0 = ((-26 - oCX)/TILE + k)/COS;
  vx1 = ((W+26 - oCX)/TILE + k)/COS;
}
function quad(ax,ay,bx,by,cx,cy,dx,dy,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx,cy); ctx.lineTo(dx,dy); ctx.fill();
}
function qpath(ax,ay,bx,by,cx,cy,dx,dy){
  ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx,cy); ctx.lineTo(dx,dy); ctx.closePath();
}
function flat(x0,x1,y0,y1,z,col){
  quad(PX(x0,y0),PY(x0,y0,z), PX(x1,y0),PY(x1,y0,z),
       PX(x1,y1),PY(x1,y1,z), PX(x0,y1),PY(x0,y1,z), col);
}
function flatPath(x0,x1,y0,y1,z){
  qpath(PX(x0,y0),PY(x0,y0,z), PX(x1,y0),PY(x1,y0,z),
        PX(x1,y1),PY(x1,y1,z), PX(x0,y1),PY(x0,y1,z));
}
function box(x,y,w,d,z0,h,top,front,side){
  const x0=x-w/2, x1=x+w/2, y0=y-d/2, y1=y+d/2, z1=z0+h;
  if(side) quad(PX(x1,y0),PY(x1,y0,z0), PX(x1,y1),PY(x1,y1,z0),
                PX(x1,y1),PY(x1,y1,z1), PX(x1,y0),PY(x1,y0,z1), side);
  if(front)quad(PX(x0,y0),PY(x0,y0,z0), PX(x1,y0),PY(x1,y0,z0),
                PX(x1,y0),PY(x1,y0,z1), PX(x0,y0),PY(x0,y0,z1), front);
  quad(PX(x0,y0),PY(x0,y0,z1), PX(x1,y0),PY(x1,y0,z1),
       PX(x1,y1),PY(x1,y1,z1), PX(x0,y1),PY(x0,y1,z1), top);
}
function box3(x,y,w,d,z0,h,p){ box(x,y,w,d,z0,h,p[0],p[1],p[2]); }
/* alleen de zijvlakken — voor opgeplakte details die het bovenvlak niet mogen overschilderen */
function boxSides(x,y,w,d,z0,h,p){
  const x0=x-w/2, x1=x+w/2, y0=y-d/2, y1=y+d/2, z1=z0+h;
  quad(PX(x1,y0),PY(x1,y0,z0), PX(x1,y1),PY(x1,y1,z0),
       PX(x1,y1),PY(x1,y1,z1), PX(x1,y0),PY(x1,y0,z1), p[2]);
  quad(PX(x0,y0),PY(x0,y0,z0), PX(x1,y0),PY(x1,y0,z0),
       PX(x1,y0),PY(x1,y0,z1), PX(x0,y0),PY(x0,y0,z1), p[1]);
}

/* ---------- het poppetje -------------------------------------------------- */
/* Eén parametrisch model; huid, haar, kapsel, kleding en accessoire per personage. */
function drawFigure(x, y, z, sq, ch, markCol){
  const wq = 1/Math.sqrt(sq);
  const sk=pal(ch.skin), hr=pal(ch.hair), sr=pal(ch.shirt), pt=pal(ch.pants);
  const ac = ch.acc ? pal(ch.accC) : null;

  const TL = ch.tall || 1;              /* Roelof steekt er bovenuit */

  /* benen */
  box3(x-0.12, y+0.02, 0.15, 0.20, z, 0.22*TL, pt);
  box3(x+0.12, y+0.02, 0.15, 0.20, z, 0.22*TL, pt);

  /* romp, armen en handen (achterste arm eerst voor de juiste overlap) */
  const tz=z+0.22*TL, tw=0.52*wq, td=0.38*wq, th=0.44*sq*TL;
  const ax=tw/2+0.065, ad=0.28*wq;
  box3(x-ax, y, 0.12, ad, tz+0.02, 0.13, sk);
  box3(x-ax, y, 0.12, ad, tz+0.15, th-0.15, sr);
  if(ch.ring){                          /* verlovingsring aan de linkerhand */
    box3(x-ax, y-0.02, 0.135, 0.10, tz+0.085, 0.035, pal('#F2C230'));
    box3(x-ax, y-0.07, 0.075, 0.055, tz+0.115, 0.075, pal('#DFF4FF'));
  }
  box3(x, y, tw, td, tz, th, sr);
  /* kledingdetails op de romp */
  const fyT = y - td/2 - 0.012;
  if(ch.band) boxSides(x, y, tw+0.014, td+0.014, tz+th*ch.band.z, ch.band.h, pal(ch.band.c));
  if(ch.tie)  boxSides(x, fyT, 0.09, 0.03, tz+th*0.32, th*0.50, pal(ch.tie));
  if(ch.bow)  boxSides(x, fyT, 0.18, 0.03, tz+th*0.74, 0.085, pal(ch.bow));
  if(ch.print){
    boxSides(x-0.10, fyT, 0.09, 0.025, tz+th*0.56, 0.09, pal(ch.print));
    boxSides(x+0.09, fyT, 0.07, 0.025, tz+th*0.30, 0.07, pal(ch.print));
  }
  if(ch.hearts){                        /* hartjesjurk: twee blokjes naast elkaar + puntje eronder */
    const hp=pal(ch.hearts);
    for(let i=0;i<2;i++){
      const hx = x + (i? 0.11 : -0.11), hzz = tz + th*(i? 0.30 : 0.58);
      boxSides(hx-0.045, fyT, 0.055, 0.025, hzz+0.045, 0.055, hp);
      boxSides(hx+0.045, fyT, 0.055, 0.025, hzz+0.045, 0.055, hp);
      boxSides(hx,       fyT, 0.055, 0.025, hzz,       0.055, hp);
    }
  }
  if(ch.flowers){                       /* bloemetjesjurk */
    const FL=[[-0.14,0.72],[0.10,0.62],[-0.04,0.44],[0.16,0.30],[-0.16,0.24],[0.02,0.14]];
    for(let i=0;i<FL.length;i++){
      const fp=pal(ch.flowers[i%ch.flowers.length]);
      const fx=x+FL[i][0], fz=tz+th*FL[i][1];
      boxSides(fx, fyT, 0.05, 0.02, fz, 0.05, fp);
      boxSides(fx-0.045, fyT, 0.035, 0.02, fz+0.005, 0.035, fp);
      boxSides(fx+0.045, fyT, 0.035, 0.02, fz+0.005, 0.035, fp);
      boxSides(fx, fyT, 0.035, 0.02, fz+0.048, 0.035, fp);
    }
  }
  box3(x+ax, y, 0.12, ad, tz+0.02, 0.13, sk);
  box3(x+ax, y, 0.12, ad, tz+0.15, th-0.15, sr);

  const hz=tz+th, hw=0.40*wq, hd=0.37*wq, hh=0.33*sq, top=hz+hh;
  const st=ch.style;

  /* haar áchter het hoofd eerst, anders klopt de overlap niet */
  if(ch.veil) box3(x, y+hd/2+0.13, hw+0.16, 0.28, top-0.80, 0.86, WED_W);
  if(st==='long'||st==='curly'||st==='bob'||st==='bigcurl'){
    const len = st==='long'?0.58 : st==='bigcurl'?0.52 : st==='curly'?0.40 : 0.28;
    box3(x, y+hd/2+0.05, hw+(st==='bigcurl'?0.10:0.02), st==='bigcurl'?0.20:0.15, top-len, len+0.05, hr);
  }
  if(st==='ponytail'){
    box3(x, y+hd/2+0.19, 0.15, 0.24, top-0.42, 0.34, hr);          // staart
    box3(x, y+hd/2+0.06, 0.17, 0.09, top-0.11, 0.08, pal('#F2C230')); // elastiekje
  }

  /* hoofd */
  box3(x, y, hw, hd, hz, hh, sk);

  /* zijhaar */
  if(st==='long'||st==='bob'||st==='curly'||st==='bigcurl'){
    const drop = st==='long'?0.15 : st==='bigcurl'?0.12 : st==='curly'?0.05 : 0.09;
    const w2   = st==='bigcurl'?0.16 : st==='curly'?0.12 : 0.09;
    box3(x-(hw/2+w2/2-0.015), y+0.01, w2, hd*0.92, hz-drop, hh+drop, hr);
    box3(x+(hw/2+w2/2-0.015), y+0.01, w2, hd*0.92, hz-drop, hh+drop, hr);
  }
  /* bovenhaar */
  const capW = st==='bigcurl' ? hw+0.16 : st==='curly' ? hw+0.09 : hw+0.03;
  const capH = st==='bigcurl' ? 0.19 : st==='curly' ? 0.15 : st==='messy' ? 0.12 : 0.10;
  box3(x, y, capW, (st==='bigcurl'?hd+0.13:st==='curly'?hd+0.07:hd+0.02), top-0.04, capH, hr);
  if(st==='bigcurl'){                    /* losse plukken eromheen voor een echte krullenbos */
    box3(x-hw/2-0.07, y-0.11, 0.16, 0.16, top-0.16, 0.15, hr);
    box3(x+hw/2+0.07, y-0.08, 0.15, 0.15, top-0.10, 0.14, hr);
    box3(x-0.10,      y+0.20, 0.17, 0.16, top+0.02, 0.14, hr);
    box3(x+0.13,      y+0.18, 0.15, 0.15, top-0.06, 0.13, hr);
  }
  if(st==='messy') box3(x-0.08, y-0.02, 0.15, 0.15, top+0.06, 0.10, hr);
  if(st==='bun')   box3(x, y+0.12, 0.22, 0.22, top+0.04, 0.16, hr);

  /* accessoires */
  if(ch.acc==='cap'){
    /* hogere bol zodat het ruitertje op de voorkant ook echt te zien is */
    box3(x, y, hw+0.07, hd+0.05, top+0.01, 0.24, ac);
    box3(x, y-hd/2-0.11, hw*0.95, 0.22, top+0.02, 0.05, ac);
    if(ch.capLogo){
      const lp=pal(ch.capLogo), ly=y-hd/2-0.045, bz=top+0.035, u=0.030;
      const em=(cx,cz,cw,chh)=>boxSides(x+cx*u, ly, cw*u, 0.02, bz+cz*u, chh*u, lp);
      em(-0.2, 2.0, 4.6, 1.5);      /* paardenlijf */
      em( 2.5, 3.3, 1.5, 1.7);      /* hals */
      em( 3.4, 4.6, 2.2, 1.4);      /* kop met snuit */
      em(-2.9, 2.6, 1.4, 1.8);      /* staart */
      em( 1.8, 0.0, 1.3, 2.2);      /* voorbeen */
      em(-1.8, 0.0, 1.3, 2.2);      /* achterbeen */
      em( 0.3, 3.4, 1.8, 2.2);      /* ruiter */
      em( 1.6, 5.6, 2.8, 1.0);      /* arm met polostick */
      em( 3.0, 6.0, 1.0, 1.8);      /* stick omhoog */
    }
  }else if(ch.acc==='beanie'){
    box3(x, y, hw+0.06, hd+0.04, top-0.05, 0.18, ac);
    box3(x, y, hw+0.08, hd+0.06, top-0.07, 0.055, pal(sh(ch.accC,1.3)));
  }else if(ch.acc==='headband'){
    box3(x, y-hd/2+0.05, hw+0.04, 0.12, top-0.09, 0.07, ac);
  }else if(ch.acc==='shades'){        /* zonnebril op het hoofd geschoven */
    box3(x, y-hd/2+0.07, hw+0.03, 0.11, top-0.06+capH, 0.06, ac);
  }
  /* trouwkleding: bloemenkrans onder de sluier, of hoge hoed */
  if(ch.veil) box3(x, y, hw+0.07, hd+0.05, top-0.06+capH, 0.06, WED_W);
  if(ch.hat){
    box3(x, y, hw+0.26, hd+0.24, top-0.03+capH, 0.05, WED_B);
    box3(x, y, hw+0.02, hd+0.02, top+0.02+capH, 0.34, WED_B);
    box3(x, y, hw+0.04, hd+0.04, top+0.26+capH, 0.05, pal('#3A3A46'));
  }
  if(ch.acc==='beard') box3(x, y-hd/2-0.015, 0.27, 0.09, hz+0.01, 0.14, ac);

  /* gezicht */
  const eyeZ = hz + hh*0.42, fy = y - hd/2 - 0.015;
  if(ch.acc==='glasses'){
    box3(x, fy, hw*0.95, 0.05, eyeZ-0.01, 0.10, ac);

/* Vier levensfases: 1 verloofd, 2 getrouwd, 3 met kroost, 4 op leeftijd.
   Elke variant wordt één keer gebouwd en daarna hergebruikt. */
const wedCache = new Map();
function outfitFor(ch, st){
  if(st < 1) return ch;
  const tier = st>=4 ? 4 : st>=2 ? 2 : 1;
  const key = ch.n + tier;
  let o = wedCache.get(key);
  if(!o){
    o = {}; for(const k in ch) o[k]=ch[k];
    if(ch.f) o.ring = 1;                       /* de ring blijft vanaf de verloving */
    if(tier>=2){
      o.band=null; o.print=null; o.tie=null; o.bow=null; o.hearts=null; o.flowers=null;
      if(ch.acc!=='glasses') o.acc='';
      if(ch.f){ o.shirt='#FFFFFF'; o.pants='#F3F3F7'; o.veil=1; }
      else    { o.shirt='#1B1B22'; o.pants='#15151B'; o.hat=1;
                o.tie='#F4F4F7'; o.bow='#1B1B22'; }
    }
    /* op leeftijd: sluier en hoge hoed gaan af zodat het grijze haar te zien is */
    if(tier>=4){ o.hair='#DEDEE4'; o.brow='#C8C8D0'; o.old=1; o.veil=null; o.hat=null; }
    wedCache.set(key,o);
  }
  return o;
}

/* ---------- dorpen onderweg -------------------------------------------------
   Elke zone heeft een eigen grastint, een blauw kombord bij binnenkomst en het
   bekendste bouwwerk van die plaats langs de kant van de weg.
   ---------------------------------------------------------------------------- */
const ZONES = [
  {n:'',             g:['#8FD82C','#7DC623'], gf:['#63A519','#589415'], lm:null},
  {n:'Hoevelaken',   g:['#93DA33','#81C927'], gf:['#66A81B','#5A9616'], lm:'manor'},   // Huis te Hoevelaken
  {n:'Woudenberg',   g:['#86D02E','#75BE24'], gf:['#5E9D18','#548C14'], lm:'castle'},  // Kasteel Geerestein
  {n:'Amersfoort',   g:['#B5AFA4','#A9A398'], gf:['#8B857A','#7F796E'], lm:'tower', urban:1}, // stad: straatstenen
  {n:'Maartensdijk', g:['#98DE3E','#86CC31'], gf:['#6CAC24','#609A1E'], lm:'church'},  // dorpskerk uit 1555
  {n:'Nijkerk',      g:['#8BD429','#7AC221'], gf:['#61A017','#568F13'], lm:'baroque'}, // witte barokke toren
  {n:'Finish',       g:['#F0DCA6','#E6D097'], gf:['#C2AC78','#B8A26F'], lm:null}       // kermisterrein
];
const ZFINISH = ZONES.length-1;
const ZONE_START=12, ZONE_LEN=20;
function zoneIdx(y){
  if(y>=CFG.finish) return ZFINISH;
  if(y<ZONE_START) return 0;
  return 1 + Math.floor((y-ZONE_START)/ZONE_LEN) % (ZONES.length-2);
}

/* ---------- wereldgeneratie ----------------------------------------------- */
const XMIN=CFG.colMin, XMAX=CFG.colMax, TRACK=CFG.track, TRAINLEN=CFG.trainLen;
const NCOL = XMAX-XMIN+1;
const allCols = ()=>{ const a=[]; for(let i=0;i<NCOL;i++) a.push(true); return a; };
let rows=new Map(), genY=0, run={type:'grass',left:0,dir:1,reach:allCols()}, T=0;

/* Zorgt dat je nooit klem komt te staan: er is altijd minstens één vrije kolom
   in de volgende rij die je vanaf je huidige positie kunt bereiken. */
function keepPassable(r){
  const free=allCols();
  for(let i=0;i<r.obs.length;i++) free[r.obs[i].x-XMIN]=false;
  let seed=[];
  for(let i=0;i<NCOL;i++) if(free[i] && run.reach[i]) seed.push(i);
  if(!seed.length){
    const cand=[];
    for(let i=0;i<NCOL;i++) if(run.reach[i]) cand.push(i);
    const c = cand.length ? cand[(Math.random()*cand.length)|0] : (NCOL>>1);
    free[c]=true;
    r.obs = r.obs.filter(o=>o.x-XMIN!==c);
    seed=[c];
  }
  const nr=[]; for(let i=0;i<NCOL;i++) nr.push(false);
  for(let s=0;s<seed.length;s++){
    const c=seed[s]; nr[c]=true;
    for(let i=c-1;i>=0 && free[i];i--) nr[i]=true;
    for(let i=c+1;i<NCOL && free[i];i++) nr[i]=true;
  }
  run.reach=nr;
}

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri =(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[(Math.random()*a.length)|0];
function wrapX(v){ const m=((v+13)%TRACK+TRACK)%TRACK; return m-13; }
const ramp=y=>Math.min(1,Math.max(0,y)/CFG.rampRows);

function nextType(y){
  if(run.left>0){ run.left--; return run.type; }
  const r=Math.random(), rail=y>=CFG.railFrom, wet=y>=6;
  let t;
  if(run.type==='grass'){
    t = r<0.40 ? 'road' : (wet&&r<0.58) ? 'water' : (rail&&r<0.72) ? 'rail'
      : r<0.72+CFG.bikeChance ? 'bike' : 'grass';
  }else{
    t = r<0.54 ? 'grass' : r<0.72 ? 'road' : (wet&&r<0.86) ? 'water'
      : r<0.86+CFG.bikeChance ? 'bike' : (rail?'rail':'grass');
  }
  const maxRoad  = y<20 ? 1 : 2;
  const maxWater = y<25 ? 0 : y<80 ? 1 : 2;
  if(t!==run.type) run.dir = Math.random()<0.5?1:-1;
  run.type=t;
  run.left = t==='grass' ? ri(0,1) : t==='road' ? ri(0,maxRoad)
           : t==='water' ? ri(0,maxWater) : 0;   /* spoor en fietspad altijd één rij */
  return t;
}

function genRow(y){
  const type = y>=CFG.finish ? 'finish'
             : y<CFG.safeRows ? 'grass' : nextType(y);
  const d=ramp(y), r={y,type};
  r.zone = zoneIdx(y);
  if(type==='finish'){
    r.alt=((y%2)+2)%2; r.obs=[]; run.reach=allCols();
    const k=y-CFG.finish;
    if(k===0) r.deco='gate';
    else if(k===2) r.deco='tent';
    else if(k===4) r.deco='ballpit';
    else if(k===6) r.deco='frituur';
    else if(k===9) r.deco='tent';
    rows.set(y,r); return r;
  }
  const zStep = y-ZONE_START;
  if(y>=ZONE_START && zStep%ZONE_LEN===0) r.sign = ZONES[r.zone].n;      /* kombord */
  if(y>=ZONE_START && (zStep%ZONE_LEN===7 || zStep%ZONE_LEN===15))
    r.lm = ZONES[r.zone].lm;                                             /* landmark, 2x per dorp */
  if(type==='grass'){
    r.alt=((y%2)+2)%2; r.obs=[];
    if(y>=CFG.safeRows){
      const free=[]; for(let x=XMIN;x<=XMAX;x++) free.push(x);
      const n=ri(1,4);
      for(let i=0;i<n && free.length>3;i++){
        const x=free.splice(ri(0,free.length-1),1)[0], q=Math.random();
        r.obs.push({x, kind:q<0.62?0:q<0.82?1:2, h:rnd(0.85,1.75),
                    urban:!!ZONES[r.zone].urban,
                    pal:Math.random()<0.5?C.leaf:C.leaf2});
      }
      r.obs.sort((a,b)=>a.x-b.x);
    }
    keepPassable(r);
    /* af en toe loopt er een schaapje (of een bokje) over de wei */
    if(y>=CFG.animalFrom && Math.random()<CFG.animalChance){
      r.animals=[{ x:rnd(XMIN,XMAX), kind:Math.random()<0.68?0:1,
                   dir:Math.random()<0.5?1:-1, sp:CFG.animalSpeed*rnd(0.7,1.3),
                   t:Math.random()*9, gone:false }];
    }
  }else if(type==='road'){
    run.dir=-run.dir; r.dir=run.dir;
    r.speed=1.6+d*2.7+rnd(0,0.9); r.veh=[];
    let p=rnd(-13,13); const n=ri(2,4);
    for(let i=0;i<n;i++){
      const truck=Math.random()<0.24, len=truck?2.3:1.35;
      r.veh.push({o:p,len,col:pick(C.car),truck});
      p += len + rnd(2.4,4.2) - d*0.5;
    }
    run.reach=allCols();          /* op wegen, water en spoor kun je overal staan */
  }else if(type==='bike'){
    run.reach=allCols();
    /* fietspad: rustig tempo, één of twee fietsers, de eerste is Tante Trieza */
    r.dir = Math.random()<0.5?1:-1;
    r.speed = 1.9 + d*0.9 + rnd(0,0.5);
    r.veh = [];
    let p=rnd(-13,13); const n=ri(1,2);
    for(let i=0;i<n;i++){
      r.veh.push({o:p, len:0.95, bike:true, say:i===0?'Tante Trieza':null,
                  col:pick(['#E2568C','#59B0D8','#E8A93C'])});
      p += 9 + rnd(0,4);
    }
  }else if(type==='water'){
    run.reach=allCols();
    run.dir=-run.dir; r.dir=run.dir;
    r.speed=1.0+d*1.5+rnd(0,0.7); r.logs=[];
    let p=rnd(-13,13); const n=ri(3,4);
    const boatAt = Math.random()<CFG.boatChance ? ri(0,n-1) : -1;
    for(let i=0;i<n;i++){
      const boat = i===boatAt, len = boat ? 3 : ri(2,3);
      r.logs.push({o:p, len, boat, say: boat?'Massss':null});
      p += len+rnd(1.5,2.6);
    }
  }else{
    run.reach=allCols();
    r.dir=Math.random()<0.5?1:-1; r.state='idle'; r.timer=rnd(1.2,4.0);
    r.trainX=0; r.blink=0; r.gate=0;
  }
  rows.set(y,r); return r;
}
function getRow(y){
  let r=rows.get(y); if(r) return r;
  if(y<0){ r={y,type:'grass',alt:((y%2)+2)%2,obs:[],zone:0}; rows.set(y,r); return r; }
  while(genY<=y){ r=genRow(genY); genY++; }
  return rows.get(y);
}
const vehX=(r,v)=>wrapX(v.o + r.dir*r.speed*T);
const logC=(r,i)=>wrapX(r.logs[i].o + r.dir*r.speed*T);

function updAnimals(r,dt){
  for(let i=0;i<r.animals.length;i++){
    const a=r.animals[i]; if(a.gone) continue;
    a.t += dt;
    a.x += a.dir*a.sp*dt;
    if(a.x < XMIN-0.7){ a.x=XMIN-0.7; a.dir=1; }
    if(a.x > XMAX+0.7){ a.x=XMAX+0.7; a.dir=-1; }
  }
}
function updRail(r,dt){
  if(r.state==='idle'){ r.timer-=dt; if(r.timer<=0){ r.state='warn'; r.timer=2.0; r.blink=0; } }
  else if(r.state==='warn'){ r.timer-=dt; r.blink+=dt;
    if(r.timer<=0){ r.state='run'; r.trainX = r.dir>0?-24:24; } }
  else { r.blink+=dt; r.trainX += r.dir*34*dt;
    if(Math.abs(r.trainX)>25){ r.state='idle'; r.timer=rnd(3,8); } }
  /* slagbomen zakken tijdens de waarschuwing en gaan pas na de trein weer omhoog */
  const want = r.state==='idle' ? 0 : 1;
  r.gate += (want - r.gate) * Math.min(1, dt*(want?2.2:1.6));
}

let AC=null, muted=false;
function tone(freq,dur,type,vol,slide){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), t0+dur);
    g.gain.setValueAtTime(vol||0.06,t0);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}

/* ---------- deeltjes -------------------------------------------------------- */
const P=[];
for(let i=0;i<CFG.maxParticles;i++) P.push({life:0,max:1,x:0,y:0,z:0,vx:0,vy:0,vz:0,s:0.1,c:'#fff'});
let pIdx=0;
function burst(x,y,z,n,col,pow){
  for(let i=0;i<n;i++){
    const p=P[pIdx++ % CFG.maxParticles];
    p.life=p.max=rnd(0.35,0.7); p.x=x; p.y=y; p.z=z;
    p.vx=rnd(-pow,pow); p.vy=rnd(-pow,pow); p.vz=rnd(pow*0.4,pow*1.5);
    p.s=rnd(0.07,0.16); p.c=col;
  }
}
function updParticles(dt){
  for(let i=0;i<P.length;i++){
    const p=P[i]; if(p.life<=0) continue;
    p.life-=dt; p.vz-=9*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(p.z<0){ p.z=0; p.vz*=-0.35; p.vx*=0.6; p.vy*=0.6; }
  }
}

/* ---------- spelers ---------------------------------------------------------- */
function mkPlayer(x, ch, mark){
  return { ch, name:ch.n, mark, x, y:0, py:0, z:0, sq:1, hopT:1, fx:x, fy:0, tx:x, ty:0,
           alive:true, deadT:0, sink:false, stork:false, storkOff:0, queue:null,
           onLog:false, logIdx:0, logOff:0, score:0, wins:0,
           stack:null, dropZ:0, buff:null, buffT:0, mount:0, order:0,
           carried:0, carryY:0,
           trail:[], bb:[{x:0,y:0,ch},{x:0,y:0,ch},{x:0,y:0,ch}], nb:0 };
}
let p1=null, p2=null, gs='menu', endT=0, countT=0;
let sel=[null,null], wins=[0,0], stage=0, bannerT=0, deathOrder=0, ringT=0;
let curZone=0, townT=0, finished=false, partyT=0;

/* op het schaap spring je iets vlotter; met de bok neem je twee rijen tegelijk */
function hopTimeOf(p){
  return CFG.hopTime * (p.buff==='ride' ? 0.86 : p.buff==='double' ? 1.15 : 1);
}

function resetRound(){
  rows.clear(); genY=0; run={type:'grass',left:0,dir:1,reach:allCols()}; T=0; camY=0; shake=0;
  stage=0; bannerT=0; banner.style.opacity=0; deathOrder=0; ringT=0;
  curZone=0; townT=0; townEl.style.opacity=0; finished=false; partyT=0;
  for(const p of P) p.life=0;
  p1 = mkPlayer(-1, CHARS[sel[0]!=null?sel[0]:0], '#2E8BE0');
  p2 = mkPlayer( 1, CHARS[sel[1]!=null?sel[1]:1], '#D82E8B');
  p1.wins=wins[0]; p2.wins=wins[1];
  for(let y=0;y<=10;y++) getRow(y);
  endT=0;
}
const killY=()=>camY-CFG.killRows;

function tryHop(p,dx,dy){
  if(gs!=='play' || !p.alive) return;
  if(p.hopT<1){ if(p.hopT>0.35) p.queue=[dx,dy]; return; }
  const cx0=Math.round(p.x);
  const tx=cx0+dx, ty=p.y+dy;
  if(tx<XMIN || tx>XMAX){
    if(dx!==0 && Math.abs(tx)>Math.abs(cx0)) return;
    if(dx===0 && Math.abs(cx0)>XMAX+2) return;
  }
  if(ty<killY()+0.4) return;
  const r=getRow(ty);
  if(r.type==='grass' && r.obs) for(let i=0;i<r.obs.length;i++) if(r.obs[i].x===tx) return;
  p.trail.unshift({x:p.x, y:p.y});
  if(p.trail.length>8) p.trail.length=8;
  p.fx=p.x; p.fy=p.y; p.tx=tx; p.ty=ty; p.hopT=0; p.onLog=false;
  p.hopZ0 = p.stack ? CFG.stackZ : p.dropZ;   /* van de schouders af spring je omlaag */
  p.stack=null; p.dropZ=0;
  if(dy>0 && ty-p.carried>p.score) p.score=ty-p.carried;
  sfxHop();
}
function land(p){
  /* op de schouders van de ander landen */
  const o = (p===p1)?p2:p1;
  if(o && o.alive && !o.stack && o.hopT>=1 && o.y===p.y && Math.abs(o.x-p.x)<0.62){
    p.stack=o; p.x=o.x; p.onLog=false; p.carryY=o.y; sfxStack();
    burst(p.x,p.py,CFG.stackZ,4,'#FFF3B0',1.0);
    return;
  }
  const r=getRow(p.y); if(r.type!=='water') return;
  for(let i=0;i<r.logs.length;i++){
    if(Math.abs(logC(r,i)-p.x) <= r.logs[i].len/2-0.15){
      p.onLog=true; p.logIdx=i; p.logOff=p.x-logC(r,i); return;
    }
  }
  p.sink=true; die(p);
}
/* schaap én bokje: je klimt erop en rijdt dwars door het verkeer */
function grab(p,a){
  a.gone=true;
  p.buff='ride'; p.buffT=CFG.rideTime; p.mount=a.kind;
  if(a.kind===0){ sfxSheep(); burst(a.x,p.py,0.3,8,'#FFFFFF',1.8); }
  else          { sfxGoat();  burst(a.x,p.py,0.3,8,'#8B6039',1.6); }
}
function die(p){
  if(!p.alive) return;
  p.alive=false; p.deadT=0; p.queue=null; p.stack=null; p.buff=null; p.buffT=0; p.nb=0;
  p.order = ++deathOrder;
  sfxBeh();                                   /* bèèèh */
  if(p.stork){ p.storkOff = (p.x<0?-1:1)*6.5; sfxStork(); }
  else if(p.sink){ burst(p.x,p.py,0.1,7,'#BEEBFF',1.6); sfxSplash(); shake=Math.max(shake,0.35); }
  else { burst(p.x,p.py,0.4,9,p.ch.shirt,2.2); sfxSplat(); shake=Math.max(shake,1); }
  /* de ander speelt gewoon door; pas als iedereen ligt is de ronde klaar */
  if(gs==='play' && !p1.alive && !p2.alive){ gs='dying'; endT=0; }
}
function updPlayer(p,dt){
  if(!p.alive){ p.deadT+=dt; return; }
  if(p.buffT>0){ p.buffT-=dt; if(p.buffT<=0){ p.buffT=0; p.buff=null; } }

  if(p.hopT<1){
    p.hopT=Math.min(1,p.hopT+dt/hopTimeOf(p));
    const t=p.hopT;
    p.x=p.fx+(p.tx-p.fx)*t; p.py=p.fy+(p.ty-p.fy)*t;
    p.z=Math.sin(t*Math.PI)*0.42 + (p.hopZ0||0)*(1-t)*(1-t);
    p.sq=1+Math.sin(t*Math.PI)*0.20;
    if(t>=1){ p.z=0; p.sq=1; p.hopZ0=0; p.y=p.ty; p.py=p.ty; land(p); }
  }else{
    p.sq += (1-p.sq)*Math.min(1,dt*14);
    if(p.stack){
      const o=p.stack;
      if(!o.alive){ p.stack=null; p.dropZ=CFG.stackZ; }   /* onderste valt weg */
      else {
        /* meeliften: je reist mee waar hij ook heen springt */
        p.x=o.x; p.y=o.y; p.py=o.py; p.z=o.z+CFG.stackZ;
        if(o.y>p.carryY) p.carried += o.y-p.carryY;       /* meegelifte rijen tellen niet */
        p.carryY=o.y;
      }
    }
    if(!p.stack){
      if(p.dropZ>0){
        p.dropZ-=dt*7;
        if(p.dropZ<=0){ p.dropZ=0; p.z=0; land(p); if(!p.alive) return; }
        else p.z=p.dropZ;
      } else p.z=0;
      if(p.onLog){
        const r=rows.get(p.y);
        if(r && r.type==='water'){
          p.x=logC(r,p.logIdx)+p.logOff;
          if(p.x<-CFG.drownEdge || p.x>CFG.drownEdge){ p.sink=true; die(p); return; }
        }
      }
      /* schaapje of bokje oppikken */
      const rr=rows.get(p.y);
      if(rr && rr.animals){
        for(let i=0;i<rr.animals.length;i++){
          const a=rr.animals[i];
          if(!a.gone && Math.abs(a.x-p.x)<0.62){ grab(p,a); break; }
        }
      }
    }
    if(p.queue){ const q=p.queue; p.queue=null; tryHop(p,q[0],q[1]); }
  }

  /* babystoet vanaf mijlpaal 2 */
  p.nb=0;
  if(stage>=3){
    for(let k=1,i=0; k<7 && i<3; k+=2,i++){
      const t=p.trail[k]; if(!t) break;
      const b=p.bb[i]; b.x=t.x; b.y=t.y; b.ch=p.ch; p.nb=i+1;
    }
  }

  /* eindpunt bereikt: vanaf hier is het feest en heeft niemand meer haast */
  if(!finished && p.y>=CFG.finish){
    finished=true; partyT=CFG.partyTime;
    showBanner('Samen gewonnen!');
    for(let i=0;i<3;i++){
      burst(p1.x, p1.py, 0.9, 8, BALLC[i%BALLC.length], 2.6);
      burst(p2.x, p2.py, 0.9, 8, BALLC[(i+3)%BALLC.length], 2.6);
    }
  }
  hazards(p);
  if(p.alive && !finished && p.py<killY()){ p.stork=true; die(p); }
}
function hazards(p){
  if(finished) return;
  if(p.stack || p.dropZ>0) return;             /* op schouders sta je boven het gevaar */
  const ry=Math.round(p.py);
  if(Math.abs(p.py-ry)>0.42) return;
  const r=rows.get(ry); if(!r) return;
  if(r.type==='road' || r.type==='bike'){
    if(p.buff==='ride') return;                /* op het schaap rijd je er dwars doorheen */
    for(let i=0;i<r.veh.length;i++){
      const v=r.veh[i];
      if(Math.abs(vehX(r,v)-p.x) < v.len/2+0.34){ die(p); return; }
    }
  }else if(r.type==='rail' && r.state==='run'){
    if(Math.abs(r.trainX-p.x) < TRAINLEN/2+0.34) die(p);
  }
}

/* ---------- tekenen --------------------------------------------------------- */
function drawGround(r){
  const y=r.y, a=vx0-1, b=vx1+1;
  if(r.type==='bike'){
    flat(a,b, y-0.5, y+0.5, 0, C.bike);
    ctx.beginPath();
    flatPath(a,b, y-0.5, y-0.44, 0.002); flatPath(a,b, y+0.44, y+0.5, 0.002);
    const s=Math.ceil(a/1.8)*1.8;
    for(let x=s;x<b;x+=1.8) flatPath(x, Math.min(x+0.8,b), y-0.03, y+0.03, 0.002);
    ctx.fillStyle=C.line; ctx.fill();
  }
  else if(r.type==='road'){
    flat(a,b,y-0.5,y+0.5,0,C.road[y&1]);
    const nx=rows.get(y+1), pv=rows.get(y-1);
    ctx.beginPath();
    if(nx && nx.type==='road'){
      const s=Math.ceil(a/2.2)*2.2;
      for(let x=s;x<b;x+=2.2) flatPath(x,Math.min(x+1.1,b), y+0.46, y+0.53, 0.002);
    }
    if(!pv || pv.type!=='road') flatPath(a,b,y-0.5,y-0.43,0.002);
    if(!nx || nx.type!=='road') flatPath(a,b,y+0.43,y+0.5,0.002);
    ctx.fillStyle=C.line; ctx.fill();
  }else if(r.type==='water'){
    flat(a,b,y-0.5,y+0.5,0,C.water);
    flat(a,b,y-0.5,y-0.34,0,C.waterD);
    ctx.beginPath();
    const ph=Math.sin(T*1.3+y)*0.9;
    for(let x=Math.ceil(a/3)*3;x<b;x+=3) flatPath(x+ph,x+ph+0.9,y+0.16,y+0.24,0.003);
    ctx.fillStyle=C.waterL; ctx.fill();
  }else{
    flat(a,b,y-0.5,y+0.5,0,C.bed);
    ctx.beginPath();
    const s=Math.ceil(a/0.62)*0.62;
    for(let x=s;x<b;x+=0.62) flatPath(x,x+0.34,y-0.34,y+0.34,0.01);
    ctx.fillStyle=C.tie; ctx.fill();
    ctx.beginPath();
    flatPath(a,b,y-0.28,y-0.19,0.06); flatPath(a,b,y+0.19,y+0.28,0.06);
    ctx.fillStyle=C.rail; ctx.fill();
  }
}
function drawGrassStrip(r){
  const y=r.y, a=vx0-1, b=vx1+1, z=0.15, Z=ZONES[r.zone||0];
  quad(PX(a,y-0.5),PY(a,y-0.5,0), PX(b,y-0.5),PY(b,y-0.5,0),
       PX(b,y-0.5),PY(b,y-0.5,z), PX(a,y-0.5),PY(a,y-0.5,z), Z.gf[r.alt]);
  flat(a,b,y-0.5,y+0.5,z,Z.g[r.alt]);
  if(Z.urban){                       /* stadsbestrating: voegen tussen de klinkers */
    ctx.beginPath();
    const s=Math.ceil(a/0.5)*0.5;
    for(let x=s;x<b;x+=0.5) flatPath(x-0.03, x+0.03, y-0.5, y+0.5, z+0.002);
    flatPath(a,b, y-0.03, y+0.03, z+0.002);
    ctx.fillStyle = r.alt ? '#948E84' : '#9E988D';
    ctx.fill();
  }
}

/* ---------- eigen pixelfont (4x5) --------------------------------------------
   De gewone canvas-tekst wordt korrelig zodra we het lage-resolutiebeeld
   opschalen; deze letters bestaan uit hele pixels en blijven dus scherp.
   ------------------------------------------------------------------------------ */
const GLYPHS={};
(function(){
  const D={
   A:'0110,1001,1111,1001,1001', B:'1110,1001,1110,1001,1110', C:'0111,1000,1000,1000,0111',
   D:'1110,1001,1001,1001,1110', E:'1111,1000,1110,1000,1111', F:'1111,1000,1110,1000,1000',
   G:'0111,1000,1011,1001,0111', H:'1001,1001,1111,1001,1001', I:'1110,0100,0100,0100,1110',
   J:'0011,0001,0001,1001,0110', K:'1001,1010,1100,1010,1001', L:'1000,1000,1000,1000,1111',
   M:'1001,1111,1111,1001,1001', N:'1001,1101,1111,1011,1001', O:'0110,1001,1001,1001,0110',
   P:'1110,1001,1110,1000,1000', Q:'0110,1001,1001,1011,0111', R:'1110,1001,1110,1010,1001',
   S:'0111,1000,0110,0001,1110', T:'1111,0100,0100,0100,0100', U:'1001,1001,1001,1001,0110',
   V:'1001,1001,1001,1001,0110', W:'1001,1001,1111,1111,0110', X:'1001,1001,0110,1001,1001',
   Y:'1001,1001,0110,0100,0100', Z:'1111,0001,0110,1000,1111', '-':'0000,0000,1111,0000,0000',
   ' ':'0000,0000,0000,0000,0000'
  };
  for(const k in D) GLYPHS[k]=D[k].split(',').map(r=>parseInt(r,2));
})();
const pixW = (t,s)=> t.length*5*s - s;
function pixText(txt, cx, cy, s, col){
  const t=String(txt).toUpperCase();
  let x=Math.round(cx - pixW(t,s)/2), y=Math.round(cy - 2.5*s);
  ctx.fillStyle=col;
  for(let i=0;i<t.length;i++){
    const g=GLYPHS[t[i]];
    if(g) for(let r=0;r<5;r++){
      const bits=g[r];
      for(let c=0;c<4;c++) if(bits & (8>>c)) ctx.fillRect(x+c*s, y+r*s, s, s);
    }
    x += 5*s;
  }
}

/* spraakwolkjes worden verzameld en pas ná de wereld getekend */
const bubPool=[]; for(let i=0;i<8;i++) bubPool.push({x:0,y:0,z:0,t:'',s:0});
let bubN=0;
function say(x,y,z,txt,style){
  if(bubN<8){ const b=bubPool[bubN++]; b.x=x;b.y=y;b.z=z;b.t=txt;b.s=style||0; }
}
function drawBubbles(){
  if(!bubN) return;
  ctx.textBaseline='middle'; ctx.textAlign='center';
  for(let i=0;i<bubN;i++){
    const b=bubPool[i];
    const sx=Math.round(PX(b.x,b.y)), sy=Math.round(PY(b.x,b.y,b.z));
    if(b.s===1){                                   /* plaatsnaam, vast op het kombord */
      if(sx<-90 || sx>W+90) continue;
      pixText(b.t, sx, sy, 2, '#FFFFFF');
      continue;
    }
    ctx.font='bold 8px system-ui,-apple-system,sans-serif';
    const w=Math.round(ctx.measureText(b.t).width)+8, h=13;
    const x0=sx-w/2, y0=sy-h-5;
    if(x0+w<0 || x0>W || y0<-h) continue;
    ctx.fillStyle='#1A1A20';
    ctx.fillRect(x0-1,y0-1,w+2,h+2);
    ctx.beginPath(); ctx.moveTo(sx-4,y0+h); ctx.lineTo(sx+4,y0+h); ctx.lineTo(sx,y0+h+6); ctx.fill();
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(x0,y0,w,h);
    ctx.beginPath(); ctx.moveTo(sx-3,y0+h-1); ctx.lineTo(sx+3,y0+h-1); ctx.lineTo(sx,y0+h+4); ctx.fill();
    ctx.fillStyle='#1A1A20';
    ctx.fillText(b.t, sx, y0+h/2+0.5);
  }
  ctx.textAlign='left';
}

function drawCrossing(r,y,side){
  const px = side<0 ? XMIN-1.2 : XMAX+1.2;
  box3(px, y, 0.24, 0.24, 0, 1.30, C.white);
  box3(px, y, 0.32, 0.32, 0.58, 0.16, C.train);

  box3(px-0.13, y-0.07, 0.20,0.18, 1.30, 0.24, pal(on?'#FF4A3D':'#3A1D1B'));
  box3(px+0.13, y-0.07, 0.20,0.18, 1.30, 0.24, pal(on?'#3A1D1B':'#FF4A3D'));

  const ang = (1-r.gate)*Math.PI/2, L=2.5, N=6;

  }
}

function drawPlayer(p){
  const x=p.x, y=p.py, z=p.z, ch=outfitFor(p.ch, stage);

  /* opgepikt door de ooievaar */
  if(!p.alive && p.stork){
    const t=p.deadT, ap=Math.min(1,t/0.55), lift=Math.max(0,t-0.55);
    const sx = x + p.storkOff*(1-ap)*(1-ap);
    const pz = lift*3.2, sz = pz + 1.12;
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0,t-1.15)/0.6);
    if(ap>=1) drawFigure(sx, y, pz, 1, ch, null);
    else      drawFigure(x,  y, 0,  1, ch, null);
    drawStork(sx, y+0.22, sz, t);
    ctx.globalAlpha=1; return;
  }
  if(!p.alive && p.sink){
    const k=Math.min(1,p.deadT*2.2);
    ctx.globalAlpha=Math.max(0,1-k*0.9);
    drawFigure(x,y,-0.10-0.75*k,1,ch,null);
    ctx.globalAlpha=1; return;
  }
  if(!p.alive){
    const k=Math.min(1,p.deadT*7), pl=pal(ch.shirt);
    box3(x,y,0.60+0.42*k,0.60+0.42*k,0,0.55*(1-0.85*k),pl);
    box3(x,y-0.02,0.42+0.20*k,0.40+0.20*k,0.55*(1-0.85*k),0.10*(1-0.7*k),pal(ch.skin));
    return;
  }
  if(z>0.04){
    ctx.globalAlpha=0.2; flat(x-0.28,x+0.28,y-0.28,y+0.28,0.02,'#000'); ctx.globalAlpha=1;
  }
  /* op het schaap of het bokje: je zit erop en rijdt dwars door het verkeer */
  if(p.buff==='ride'){
    RIDER.x=x; RIDER.kind=p.mount; RIDER.dir=1; RIDER.t=T*2.2;
    drawAnimal(RIDER, y);
    drawFigure(x, y+0.06, z+0.40, p.sq, ch);
  } else {
    drawFigure(x,y,z,p.sq,ch);
  }
}

  const cx=(p1.x+p2.x)/2, cy=(p1.py+p2.py)/2;
  const cz=1.75 + Math.sin(T*2)*0.10, R=0.52, N=10, a0=T*1.5;
  ctx.globalAlpha=Math.min(1, ringT/0.5);
  for(let i=0;i<N;i++){
    const a=a0+i*2*Math.PI/N;
    box3(cx+Math.cos(a)*R, cy, 0.15,0.15, cz+Math.sin(a)*R*0.95, 0.15, pal('#F5C531'));
  }
  box3(cx, cy, 0.28,0.26, cz+R*0.95+0.08, 0.26, pal('#E4F6FF'));
  box3(cx, cy, 0.16,0.16, cz+R*0.95+0.32, 0.10, pal('#FFFFFF'));
  ctx.globalAlpha=1;
}

const oX=new Float64Array(48), oK=new Int8Array(48), oR=new Array(48);
let oN=0;
function push(x,k,ref){
  if(oN>=48 || x<vx0-3 || x>vx1+3) return;
  let i=oN++;
  while(i>0 && oX[i-1]>x){ oX[i]=oX[i-1]; oK[i]=oK[i-1]; oR[i]=oR[i-1]; i--; }
  oX[i]=x; oK[i]=k; oR[i]=ref;
}

function draw(){
  oCX=CX; oCY=CY;
  if(shake>0.01){ oCX+=(Math.random()*2-1)*shake*7; oCY+=(Math.random()*2-1)*shake*7; }
  camSX=camY*SIN; camSY=camY*COS;
  bubN=0;
  ctx.fillStyle=C.grass[1]; ctx.fillRect(0,0,W,H);

  const yFar=Math.ceil(camY+ROWS_UP), yNear=Math.floor(camY-ROWS_DN);
  for(let y=yFar;y>=yNear;y--){
    const r=getRow(y);
    viewRange(y);
    if(r.type==='grass'||r.type==='finish') drawGrassStrip(r); else drawGround(r);

    oN=0;
    if(r.deco) push(r.deco==='ballpit' ? 2.3 : r.deco==='gate' ? 0 : -2.2, 11, r.deco);
    if(r.lm)   push(XMIN-2.2, 9, r.lm);
    if(r.sign) push(XMIN-2.2, 10, r);
    if(r.type==='grass'){
      for(let i=0;i<r.obs.length;i++) push(r.obs[i].x,0,r.obs[i]);
      if(r.animals) for(let i=0;i<r.animals.length;i++){
        const a=r.animals[i]; if(!a.gone) push(a.x,8,a);
      }
    }
    else if(r.type==='road'||r.type==='bike'){ for(let i=0;i<r.veh.length;i++) push(vehX(r,r.veh[i]),1,r.veh[i]); }
    else if(r.type==='water'){ for(let i=0;i<r.logs.length;i++) push(logC(r,i),2,i); }
    else { if(r.state==='run') push(r.trainX,3,null);
           push(XMIN-1.2,4,-1); push(XMAX+1.2,4,1); }
    /* baby's eerst, dan de spelers; wie op de ander staat wordt als laatste getekend */
    if(p1) for(let i=0;i<p1.nb;i++){ const b=p1.bb[i]; if(Math.round(b.y)===y) push(b.x,7,b); }
    if(p2) for(let i=0;i<p2.nb;i++){ const b=p2.bb[i]; if(Math.round(b.y)===y) push(b.x,7,b); }
    if(p1 && p2 && p1.stack===p2){
      if(Math.round(p2.py)===y) push(p2.x,5,p2);
      if(Math.round(p1.py)===y) push(p1.x,5,p1);
    }else{
      if(p1 && Math.round(p1.py)===y) push(p1.x,5,p1);
      if(p2 && Math.round(p2.py)===y) push(p2.x,5,p2);
    }
    for(let i=0;i<P.length;i++){ const p=P[i]; if(p.life>0 && Math.round(p.y)===y) push(p.x,6,p); }

    for(let i=0;i<oN;i++){
      switch(oK[i]){
        case 0: drawObs(oR[i],y); break;
        case 1: drawVeh(r,oR[i],y); break;
        case 2: drawLog(r,oR[i],y); break;
        case 3: drawTrain(r,y); break;
        case 4: drawCrossing(r,y,oR[i]); break;
        case 5: drawPlayer(oR[i]); break;
        case 6: { const p=oR[i]; ctx.globalAlpha=Math.max(0,p.life/p.max);
                  box3(p.x,p.y,p.s,p.s,p.z,p.s,pal(p.c)); ctx.globalAlpha=1; break; }
        case 7: drawBaby(oR[i]); break;
        case 8: drawAnimal(oR[i],y); break;
        case 9: drawLandmark(oR[i],y); break;
        case 10: drawSign(oR[i],y); break;
        case 11: drawDeco(oR[i],y); break;
      }
    }
  }
  if(ringT>0 && p1 && p2) drawBigRing();
  drawBubbles();
  ctx.fillStyle='rgba(0,0,0,0.10)'; ctx.fillRect(0,H-64,W,22);
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(0,H-42,W,22);
  ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(0,H-20,W,20);
}

/* ---------- UI ---------------------------------------------------------------- */
const $=id=>document.getElementById(id);
const s1=$('s1'), s2=$('s2'), n1=$('n1'), n2=$('n2'), wl=$('wl'),
      menu=$('menu'), pickScr=$('pick'), endScr=$('end'),
      grid=$('grid'), pickHead=$('pickHead'), startBtn=$('startBtn'),
      endTitle=$('endTitle'), endSub=$('endSub'), countEl=$('count'),
      banner=$('banner'), b1=$('b1'), b2=$('b2'), bgm=$('bgm'),
      townEl=$('town'), townTxt=$('town').children[0];
let lastS1=-1,lastS2=-1,lastW='',lastB1='',lastB2='';
function buffText(p){
  if(!p.alive) return '✕';
  if(p.stack)  return 'MEELIFTEN';
  if(!p.buff)  return '';
  return (p.mount ? 'OP HET BOKJE ' : 'OP HET SCHAAP ') + Math.ceil(p.buffT) + 's';
}
function hud(){
  if(!p1) return;
  if(p1.score!==lastS1) s1.textContent=lastS1=p1.score;
  if(p2.score!==lastS2) s2.textContent=lastS2=p2.score;
  const w=wins[0]+' – '+wins[1];
  if(w!==lastW) wl.textContent=lastW=w;
  const t1=buffText(p1); if(t1!==lastB1){ b1.textContent=lastB1=t1;
    b1.style.color = !p1.alive?'#FF8A8A' : p1.stack?'#FFE98A' : p1.mount?'#E0A46A':'#FFFFFF'; }
  const t2=buffText(p2); if(t2!==lastB2){ b2.textContent=lastB2=t2;
    b2.style.color = !p2.alive?'#FF8A8A' : p2.stack?'#FFE98A' : p2.mount?'#E0A46A':'#FFFFFF'; }
}
const MILE_TXT=['Verloofd!','Bruiloft!','Baby’s!','Samen oud!'];
const MILE_COL=[['#FFE98A','#FFFFFF'],['#FFFFFF','#FFF07A'],['#FFD9E8','#D9E8FF'],['#DCDCE2','#EFEFF4']];
function showBanner(txt){ banner.textContent=txt; bannerT=2.8; sfxMile(); }
/* dorpsnaam groot in beeld zodra je de kom binnenkomt */
function checkTown(){
  let ly=-1e9;
  if(p1.alive) ly=Math.max(ly,p1.py);
  if(p2.alive) ly=Math.max(ly,p2.py);
  if(ly<-1e8) return;
  const z=zoneIdx(Math.round(ly));
  if(z!==curZone){
    curZone=z;
    if(z>0 && ZONES[z].n){ townTxt.textContent=ZONES[z].n; townT=2.6;
                           tone(700,0.07,'square',0.05,980); }
  }
}
function checkMilestones(){
  if(stage>=CFG.miles.length) return;
  const low = Math.min(p1.score, p2.score);
  if(low >= CFG.miles[stage]){
    const c=MILE_COL[stage];
    showBanner(MILE_TXT[stage]);
    if(stage===0) ringT=2.8;              /* grote ring met diamant boven het stel */
    stage++;
    burst(p1.x,p1.py,0.8,10,c[0],2.2); burst(p2.x,p2.py,0.8,10,c[1],2.2);
  }
}

/* --- keuzescherm --- */
let picking=0;
const cards=[];
function buildGrid(){
  grid.innerHTML='';
  cards.length=0;
  CHARS.forEach((ch,i)=>{
    const el=document.createElement('div');
    el.className='card';
    const cvp=document.createElement('canvas');
    cvp.width=54; cvp.height=64;
    const nm=document.createElement('div');
    nm.className='nm'; nm.textContent=ch.n;
    const bd=document.createElement('div');
    bd.className='badge'; bd.style.display='none';
    el.appendChild(cvp); el.appendChild(nm); el.appendChild(bd);
    el.addEventListener('click',()=>choose(i));
    grid.appendChild(el);
    cards.push({el,bd});
    renderPreview(cvp,ch);
  });
}
function choose(i){
  if(sel[0]===i || sel[1]===i) return;
  if(picking>1) return;
  sel[picking]=i; picking++;
  sfxPick();
  refreshPick();
}
function clearSel(){ sel=[null,null]; picking=0; refreshPick(); }
function refreshPick(){
  cards.forEach((c,i)=>{
    c.el.classList.remove('p1','p2');
    c.bd.style.display='none';
    if(sel[0]===i){ c.el.classList.add('p1'); c.bd.textContent='P1'; c.bd.style.display='block'; }
    if(sel[1]===i){ c.el.classList.add('p2'); c.bd.textContent='P2'; c.bd.style.display='block'; }
  });
  if(picking===0){ pickHead.textContent='Speler 1 kiest'; pickHead.style.color='#8FC9FF'; }
  else if(picking===1){ pickHead.textContent='Speler 2 kiest'; pickHead.style.color='#FFA6D8'; }
  else { pickHead.textContent=CHARS[sel[0]].n+'  vs  '+CHARS[sel[1]].n; pickHead.style.color='#fff'; }
  startBtn.disabled = picking<2;
}
function openPicker(){
  if(!cards.length) buildGrid();
  clearSel();
  wins=[0,0]; lastW='';               // nieuwe match, nieuwe rondestand
  menu.classList.add('hide'); endScr.classList.add('hide'); pickScr.classList.remove('hide');
  gs='menu';
}

/* ---------- lus ----------------------------------------------------------------- */
let last=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last){ last=ts; return; }
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;

  if(gs==='count'){
    countT-=dt;
    const n=Math.ceil(countT);
    countEl.textContent = countT>0 ? (n>0?n:'') : 'GO!';
    countEl.className='pix on';
    if(countT<=-0.45){ countEl.className='pix'; gs='play'; }
  }
  if(gs==='play' || gs==='dying'){
    T+=dt;
    const yFar=Math.ceil(camY+ROWS_UP);
    for(let y=Math.floor(camY-ROWS_DN);y<=yFar;y++){
      const r=getRow(y);
      if(r.type==='rail') updRail(r,dt);
      else if(r.animals) updAnimals(r,dt);
    }
    updPlayer(p1,dt); updPlayer(p2,dt);
    if(gs==='play'){ checkMilestones(); checkTown(); }
    /* de camera volgt alleen wie nog leeft — het platte poppetje blijft liggen */
    let tg=-1e9;
    if(p1.alive) tg=Math.max(tg,p1.py);
    if(p2.alive) tg=Math.max(tg,p2.py);
    if(finished) tg=Math.min(tg, CFG.finish+1);      /* bij de finish blijft de camera staan */
    if(tg>camY) camY += (tg-camY)*Math.min(1,dt*CFG.camFollow);
    acc+=dt;
    if(acc>1.5){ acc=0; const cut=Math.floor(camY-40);
      for(const k of rows.keys()) if(k<cut) rows.delete(k); }
    if(partyT>0){
      partyT-=dt;
      if(Math.random()<0.5){
        const p = Math.random()<0.5 ? p1 : p2;
        burst(p.x+rnd(-1,1), p.py+rnd(-1,1), 1.4, 2, pick(BALLC), 1.8);
      }
      if(partyT<=0){ winTogether(); }
    }
    else if(gs==='dying'){
      endT+=dt;
      if(endT > ((p1.stork||p2.stork) ? CFG.storkTime : 0.85)) finish();
    }
    hud();
  }
  if(bannerT>0){
    bannerT-=dt;
    banner.style.opacity = Math.max(0, Math.min(1, bannerT>2.3 ? (2.8-bannerT)/0.5 : bannerT/0.8));
  }
  if(ringT>0) ringT-=dt;
  if(townT>0){
    townT-=dt;
    townEl.style.opacity = Math.max(0, Math.min(1, townT>2.1 ? (2.6-townT)/0.4 : townT/0.7));
  }
  if(shake>0) shake=Math.max(0,shake-dt*3.2);
  updParticles(dt);
  if(p1) draw();
}

/* rij 100 gehaald: het potje is voor allebei */
function winTogether(){
  gs='over';
  wins[0]++; wins[1]++;
  endTitle.textContent='Samen gewonnen!';
  endSub.textContent = p1.name+' en '+p2.name+' haalden samen het eind van de weg — '
    + 'ballenbad, circus en een frituurpan vol kroketten. '
    + (stage>=4 ? 'Getrouwd, kinderen groot, en nog steeds samen op pad.'
      : stage>=3 ? 'Met de hele kinderschare erbij.'
      : stage>=2 ? 'Als getrouwd stel.' : '');
  sfxWin(); hud();
  endScr.classList.remove('hide');
  if(navigator.vibrate) try{navigator.vibrate([60,50,60,50,120]);}catch(e){}
}
function einde(p){
  return p.stork ? 'werd op rij '+p.score+' door de ooievaar opgehaald'
       : p.sink  ? 'verdween op rij '+p.score+' in het water'
       :           'ligt plat op rij '+p.score;
}
function finish(){
  gs='over';
  /* wie het verst kwam wint; bij gelijke stand telt wie het langst overeind bleef */
  let wi = p1.score>p2.score ? 0 : p2.score>p1.score ? 1
         : p1.order>p2.order ? 0 : p2.order>p1.order ? 1 : -1;
  if(wi<0){
    endTitle.textContent='Gelijkspel';
    endSub.textContent = p1.name+' en '+p2.name+' strandden allebei op rij '+p1.score+'.';
  }else{
    const w = wi?p2:p1, l = wi?p1:p2;
    wins[wi]++;
    endTitle.textContent = w.name+' wint!';
    const fase = ['',' Verloofd onderweg.',' Getrouwd onderweg.',' Getrouwd én met kroost.',
                  ' Samen oud geworden.'][stage] || '';
    endSub.textContent = w.name+' haalde rij '+w.score+' en '+einde(w)+'. '
      + l.name+' '+einde(l)+'.' + fase;
    sfxWin();
  }
  hud();
  endScr.classList.remove('hide');
  if(navigator.vibrate) try{navigator.vibrate(80);}catch(e){}
}

function start(){
  resetRound();
  musicOn();
  lastS1=lastS2=-1; lastW=''; lastB1=lastB2='x';
  n1.textContent=p1.name; n2.textContent=p2.name;
  hud();
  menu.classList.add('hide'); pickScr.classList.add('hide'); endScr.classList.add('hide');
  countT=3; gs='count';
  tone(440,0.05,'square',0.03);
}

/* ---------- achtergrondmuziek ------------------------------------------------------ */
bgm.volume = 0.42;
function musicOn(){
  if(muted || !bgm.getAttribute('src')) return;
  const pr = bgm.play();
  if(pr && pr.catch) pr.catch(()=>{});
}

/* ---------- invoer --------------------------------------------------------------- */
function fire(p,dir){
  if(dir===0) tryHop(p,0,1); else if(dir===1) tryHop(p,0,-1);
  else if(dir===2) tryHop(p,-1,0); else tryHop(p,1,0);
}
const touches=new Map();
wrap.addEventListener('touchstart', e=>{
  const half=wrap.clientWidth/2;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    touches.set(t.identifier,{sx:t.clientX,sy:t.clientY,who:t.clientX<half?1:2,moved:false});
  }
  if(gs==='play'||gs==='count') e.preventDefault();
},{passive:false});
wrap.addEventListener('touchmove', e=>{
  if(gs!=='play' && gs!=='count' && gs!=='dying') return;
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i], s=touches.get(t.identifier);
    if(!s || s.moved) continue;
    const dx=t.clientX-s.sx, dy=t.clientY-s.sy;
    if(dx*dx+dy*dy>640){
      s.moved=true;
      const p=s.who===1?p1:p2;
      if(Math.abs(dx)>Math.abs(dy)) fire(p,dx>0?3:2); else fire(p,dy>0?1:0);
    }
  }
  e.preventDefault();
},{passive:false});
function endTouch(e){
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i], s=touches.get(t.identifier);
    if(!s) continue;
    touches.delete(t.identifier);
    if(!s.moved && gs==='play') fire(s.who===1?p1:p2,0);
  }
}
wrap.addEventListener('touchend',endTouch,{passive:false});
wrap.addEventListener('touchcancel',endTouch,{passive:false});
wrap.addEventListener('mousedown', e=>{
  if(gs!=='play') return;
  fire(e.clientX < wrap.clientWidth/2 ? p1 : p2, 0);
});
const KEYS={KeyW:[1,0],KeyS:[1,1],KeyA:[1,2],KeyD:[1,3],
            ArrowUp:[2,0],ArrowDown:[2,1],ArrowLeft:[2,2],ArrowRight:[2,3]};
addEventListener('keydown', e=>{
  if(e.code==='Enter'||e.code==='Space'){
    if(gs==='over'){ start(); e.preventDefault(); }
    else if(gs==='menu' && picking===2){ start(); e.preventDefault(); }
    return;
  }
  const k=KEYS[e.code]; if(!k) return;
  e.preventDefault();
  if(gs==='play') fire(k[0]===1?p1:p2,k[1]);
});

$('toPick').addEventListener('click', openPicker);
$('clearSel').addEventListener('click', clearSel);
startBtn.addEventListener('click', ()=>{ if(picking===2) start(); });
$('again').addEventListener('click', start);
$('swap').addEventListener('click', openPicker);
$('mute').addEventListener('click', function(){
  muted=!muted; this.textContent=muted?'🔇':'♪';
  if(muted) bgm.pause();
  else { tone(660,0.06,'square',0.05); musicOn(); }
});
/* iPhone-Safari kent geen fullscreen-API: knop dan gewoon verbergen */
(function(){
  const el=document.documentElement, btn=$('fs');
  const f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!f){ btn.style.display='none'; return; }
  btn.addEventListener('click', ()=>{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      try{ const r=f.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(e){}
    }else if(document.exitFullscreen) document.exitFullscreen();
  });
})();
/* dubbeltik-zoom en knijpzoom in Safari blokkeren */
['gesturestart','gesturechange','gestureend'].forEach(g=>
  document.addEventListener(g, e=>e.preventDefault(), {passive:false}));
let lastTap=0;
document.addEventListener('touchend', e=>{
  const now=Date.now();
  if(now-lastTap<320) e.preventDefault();
  lastTap=now;
}, {passive:false});
document.addEventListener('visibilitychange', ()=>{
  last=0;
  if(document.hidden) bgm.pause(); else if(gs==='play'||gs==='count'||gs==='dying') musicOn();
});

/* ---------- start ----------------------------------------------------------------- */
/* iPhone: waarschuw dat de belknop het geluid dempt en tip volledig scherm */
(function(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent||'')
           || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(!ios) return;
  $('iosnote').innerHTML = 'iPhone: zet het belletje-schuifje aan de zijkant op geluid, '
    + 'anders blijft het stil. Open je dit in Safari? Deel &rarr; Zet op beginscherm '
    + 'geeft je het volledige scherm.';
})();

resize();
resetRound();          /* wereld draait als achtergrond achter het menu */
$('sub').innerHTML='Tik = vooruit, veeg = opzij of terug.<br>Haal samen rij 100.';
requestAnimationFrame(frame);
</script>
